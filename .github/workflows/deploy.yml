name: Deploy

# prod is the release branch: every push runs the full CI gate, then applies
# migrations, then ships the backend and web projects to Vercel. Each step only runs if the
# previous one passed, so a red CI or a failed migration never deploys.
#
# Vercel's own git integration must NOT also deploy prod (see the `git` block
# in the root vercel.json), or it would ship before CI and migrations ran.

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never run two deploys at once, and never cancel one mid-migration.
  group: deploy-prod
  cancel-in-progress: false

jobs:
  changes:
    name: detect affected apps
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          backend=false
          web=false
          while IFS= read -r file; do
            case "$file" in
              apps/backend/*)
                backend=true
                ;;
              apps/web/*)
                web=true
                ;;
              packages/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.npmrc|turbo.json|vercel.json)
                backend=true
                web=true
                ;;
            esac
          done < <(git diff --name-only "$BEFORE" "$SHA")

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  ci:
    if: github.ref == 'refs/heads/prod'
    uses: ./.github/workflows/ci.yml

  migrate:
    name: migrate database
    if: needs.changes.outputs.backend == 'true'
    needs: [changes, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter backend...

      # Runs before the new code ships, so every migration must be safe for
      # the currently deployed code too (add columns/tables first; drop or
      # rename in a later release).
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter backend db:migrate

  deploy_backend:
    name: deploy backend to Vercel
    needs: [changes, migrate]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Pull Vercel project settings and env
        run: npx --yes vercel@latest pull --yes --project="$VERCEL_PROJECT_ID" --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx --yes vercel@latest build --prod --project="$VERCEL_PROJECT_ID" --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --project="$VERCEL_PROJECT_ID" --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The build can succeed while the app crashes on boot (e.g. a missing
      # env var fails the Zod config check), so hit the health route. It goes
      # through the production domain: the per-deployment URL sits behind
      # Vercel's deployment protection and would answer 401.
      - name: Smoke test
        env:
          PRODUCTION_URL: ${{ vars.BACKEND_PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::BACKEND_PRODUCTION_URL is required in the production environment."
            exit 1
          fi
          for i in 1 2 3 4 5; do
            status=$(curl -L -s -o /dev/null -w '%{http_code}' "$PRODUCTION_URL/health" || true)
            echo "attempt $i: /health -> $status"
            [ "$status" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::/health never returned 200. Roll back with 'vercel rollback' or from the Vercel dashboard."
          exit 1

  deploy_web:
    name: deploy web to Vercel
    needs: [changes, ci, migrate, deploy_backend]
    if: always() && needs.changes.outputs.web == 'true' && needs.ci.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && (needs.deploy_backend.result == 'success' || (needs.deploy_backend.result == 'skipped' && needs.changes.outputs.backend != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Pull Vercel project settings and env
        run: npx --yes vercel@latest pull --yes --project="$VERCEL_PROJECT_ID" --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx --yes vercel@latest build --prod --project="$VERCEL_PROJECT_ID" --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --project="$VERCEL_PROJECT_ID" --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test web
        env:
          PRODUCTION_URL: ${{ vars.WEB_PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::WEB_PRODUCTION_URL is required in the production environment."
            exit 1
          fi
          for i in 1 2 3 4 5; do
            status=$(curl -L -s -o /dev/null -w '%{http_code}' "$PRODUCTION_URL" || true)
            echo "attempt $i: web -> $status"
            [ "$status" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::web production URL never returned 200."
          exit 1
